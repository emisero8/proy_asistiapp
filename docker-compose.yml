version: "3.8"

services:
  # ── MailHog — servidor SMTP local para desarrollo ──────────────────
  # UI web:  http://localhost:8025  (bandeja de entrada)
  # SMTP:    localhost:1025          (ya configurado en application.yml)
  mailhog:
    image: mailhog/mailhog
    container_name: asistiapp-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web
    restart: unless-stopped
