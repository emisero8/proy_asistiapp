spring:
  config:
    # Archivo opcional backend/.env (ignorado por Git) con líneas CLAVE=valor: sirve para tener en un solo lugar
    # las credenciales locales (SMTP_*, MP_*...). Las variables de entorno reales tienen prioridad sobre este archivo.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asistiapp_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false   # Deshabilitado: API REST no usa vistas con lazy loading
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Límite de subida de imágenes (el default de Spring es 1MB, muy poco para fotos de celular)
      max-file-size: 5MB
      max-request-size: 5MB

  # ── SMTP (envío de mails) ────────────────────────────────────────────
  # Por defecto apunta a MailHog (desarrollo local: SMTP en localhost:1025, bandeja en
  # http://localhost:8025). Para usar Gmail u otro proveedor NO hace falta editar este archivo:
  # alcanza con definir variables de entorno (las credenciales nunca van en el repo).
  #
  #   Gmail:  SMTP_HOST=smtp.gmail.com  SMTP_PORT=587  SMTP_AUTH=true  SMTP_STARTTLS=true
  #           SMTP_USERNAME=tu_cuenta@gmail.com  SMTP_PASSWORD=<contraseña de aplicación de 16 letras>
  #   La contraseña de aplicación se genera en la cuenta de Google (requiere verificación en 2 pasos);
  #   NO sirve la contraseña normal de la cuenta. Gmail envía siempre desde la cuenta autenticada.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  cloudinary:
    # Credenciales por variable de entorno; nunca van en el repo.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  mercadopago:
    # Credenciales por variable de entorno; nunca van en el repo.
    # access-token: "Credenciales de prueba" de la app (TEST-...) en sandbox, de producción al lanzar.
    access-token: ${MP_ACCESS_TOKEN:}
    # Clave secreta de Webhooks (panel de la app → Webhooks): valida la firma x-signature.
    webhook-secret: ${MP_WEBHOOK_SECRET:}
    # Valida la firma x-signature de cada webhook. DEJAR EN true EN PRODUCCIÓN: solo se apaga
    # en el sandbox local, donde MP firma los pagos de usuarios de prueba con una clave que no
    # coincide con la del panel. Aun apagada, cada pago se vuelve a consultar a la API de MP.
    validar-firma-webhook: ${MP_VALIDAR_FIRMA:true}
    # URL pública (HTTPS) del backend a la que MP envía las notificaciones (ngrok en local).
    backend-public-url: ${BACKEND_PUBLIC_URL:http://localhost:8080}
    # Minutos que una orden queda abierta para pagar antes de vencer.
    minutos-vencimiento-orden: ${MP_MINUTOS_VENCIMIENTO:30}
    # Cada cuántos segundos, como mucho, se consulta a MercadoPago por una misma orden cuando el
    # comprador mira el estado de su pago (el resto de las consultas se responde desde la base).
    intervalo-reconciliacion-segundos: ${MP_INTERVALO_RECONCILIACION_SEGUNDOS:10}
  jwt:
    # Sin variable de entorno JWT_SECRET seteada, cae al valor de desarrollo de abajo.
    # NUNCA usar ese default en producción — es público (está en el repo).
    secret: ${JWT_SECRET:TuClaveSecretaMuyLargaParaAsistiAPP_SoloParaDesarrollo_2024}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas
  cors:
    # Orígenes permitidos del Frontend, separados por coma. Ajustar por entorno.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  rate-limit:
    # Cuántos proxies/balanceadores PROPIOS hay delante del backend (nginx, etc.). Con 0 se cuenta
    # a cada cliente por la IP de su conexión y se ignora el header X-Forwarded-For, que lo puede
    # inventar cualquiera. Si se despliega detrás de un proxy, ponerlo en su cantidad (normalmente 1);
    # si no, todos los usuarios compartirían la IP del proxy y el mismo límite.
    proxies-confiables: ${RATE_LIMIT_PROXIES_CONFIABLES:0}
  admin-inicial:
    # Primer Administrador (solo se crea si no existe ninguno). Sin password: en desarrollo se usa una
    # de desarrollo pública; con el perfil "prod" no se crea nada. Ver AdminInicialSeeder.
    email: ${ADMIN_INICIAL_EMAIL:}
    password: ${ADMIN_INICIAL_PASSWORD:}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

logging:
  level:
    com.asistiapp: DEBUG
    org.springframework.security: DEBUG
  # Ademas de la consola, todo log (incluidos los 500 que loguea
  # GlobalExceptionHandler con el stack trace completo) queda en disco.
  # Asi un error durante una demo/uso real no se pierde con la terminal.
  file:
    name: logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
