spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asistiapp_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false   # Deshabilitado: API REST no usa vistas con lazy loading
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:tu_email@gmail.com}
    password: ${SMTP_PASSWORD:tu_app_password_aqui}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # Sin variable de entorno JWT_SECRET seteada, cae al valor de desarrollo de abajo.
    # NUNCA usar ese default en producción — es público (está en el repo).
    secret: ${JWT_SECRET:TuClaveSecretaMuyLargaParaAsistiAPP_SoloParaDesarrollo_2024}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas
  cors:
    # Orígenes permitidos del Frontend, separados por coma. Ajustar por entorno.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.asistiapp: DEBUG
    org.springframework.security: DEBUG
